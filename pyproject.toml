[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modelvm"
version = "0.1.0"
description = "Virtual Memory for Intelligence: A local AI runtime treating open-weight models as pageable cognitive resources"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "websockets>=12.0"
]

[project.scripts]
modelvm = "modelvm.cli:main"
